    <script>
        // IMMEDIATE THEME & LANGUAGE APPLICATION
        // This script runs synchronously and applies the theme and language
        // before the browser paints the body, preventing FOUC (Flash Of Unstyled Content).
        (function() {
            const isFirstVisit = !localStorage.getItem('hasVisited');

            if (isFirstVisit) {
                localStorage.setItem('language', 'en'); // Default to English on first visit
                localStorage.setItem('theme', 'light'); // Default to light theme on first visit
                localStorage.setItem('hasVisited', 'true');
            }

            const storedTheme = localStorage.getItem('theme') || 'light';
            const storedLanguage = localStorage.getItem('language') || 'en';

            document.documentElement.setAttribute('data-theme', storedTheme);
            document.documentElement.lang = storedLanguage;
        })();
    </script>

            visibility: visible;

        /* Spinner Styles */

            transform: translate(-50%, -50%);

            display: none; /* Hidden by default */

            .main-nav .dropdown-menu {

        @media (min-width: 768px) {

            }
            .control-button {
                padding: calc(var(--base-spacing) * 0.7) calc(var(--base-spacing) * 1.2);
                font-size: 1.2rem;
            }
            .viewer-close-button,
            .viewer-nav-button {
                font-size: 3rem;
                width: 70px;
                height: 70px;
            }
        }

    </style>

                'Galerie-71.jpg',  'Galerie-72.jpg',  'Galerie-73.jpg',  'Galerie-74.jpg',  'Galerie-75.jpg',
                'Galerie-76.jpg',  'Galerie-77.jpg',  'Galerie-78.jpg',  'Galerie-79.jpg',  'Galerie-80.jpg',
                'Galerie-81.jpg',  'Galerie-82.jpg',  'Galerie-83.jpg',  'Galerie-84.jpg',  'Galerie-85.jpg',
                'Galerie-86.jpg',  'Galerie-87.jpg',  'Galerie-88.jpg',  'Galerie-89.jpg',  'Galerie-90.jpg',
                'Galerie-91.jpg',  'Galerie-92.jpg',  'Galerie-93.jpg',  'Galerie-94.jpg',  'Galerie-95.jpg',
                'Galerie-96.jpg',  'Galerie-97.jpg',  'Galerie-98.jpg',  'Galerie-99.jpg',  'Galerie-100.jpg',
                'Galerie-101.jpg', 'Galerie-102.jpg', 'Galerie-103.jpg', 'Galerie-104.jpg', 'Galerie-105.jpg',
                'Galerie-106.jpg', 'Galerie-107.jpg', 'Galerie-108.jpg', 'Galerie-109.jpg', 'Galerie-110.jpg',
                'Galerie-111.jpg', 'Galerie-112.jpg', 'Galerie-113.jpg', 'Galerie-114.jpg', 'Galerie-115.jpg',
                'Galerie-116.jpg', 'Galerie-117.jpg', 'Galerie-118.jpg', 'Galerie-119.jpg', 'Galerie-120.jpg',
                'Galerie-121.jpg', 'Galerie-122.jpg', 'Galerie-123.jpg', 'Galerie-124.jpg', 'Galerie-125.jpg',
                'Galerie-126.jpg', 'Galerie-127.jpg', 'Galerie-128.jpg', 'Galerie-129.jpg', 'Galerie-130.jpg',
                'Galerie-131.jpg', 'Galerie-132.jpg', 'Galerie-133.jpg', 'Galerie-134.jpg', 'Galerie-135.jpg',
                'Galerie-136.jpg', 'Galerie-137.jpg', 'Galerie-138.jpg', 'Galerie-139.jpg', 'Galerie-140.jpg',
                'Galerie-141.jpg', 'Galerie-142.jpg', 'Galerie-143.jpg', 'Galerie-144.jpg', 'Galerie-145.jpg'
            ];

            const thumbPath = 'images/thumbs/';
            const fullsizePath = 'images/fullsize/';

            // --- TRANSLATIONS ---
            const translations = {
                en: {
                    siteTitle: "Marius Jomphe ‧ Photography",
                    navImages: "GALLERY",
                    navAbout: "ABOUT",                        
                    navProjects: "PROJECTS",
                    projectBruine: "BRUINE",
                    projectPassage: "PASSAGE",
                    navContact: "CONTACT",
                    themeToggleDark: "🌓 DARK THEME",
                    themeToggleLight: "🌓 LIGHT THEME",
                    languageToggleText: "🌐 FRANÇAIS", 
                    footerRights: "All rights reserved."
                },
                fr: {
                    siteTitle: "Marius Jomphe ‧ Photographie",
                    navImages: "GALERIE",
                    navAbout: "À PROPOS",                        
                    navProjects: "PROJETS",
                    projectBruine: "BRUINE",
                    projectPassage: "PASSAGE",
                    navContact: "CONTACT",
                    themeToggleDark: "🌓 THÈME SOMBRE",
                    themeToggleLight: "🌓 THÈME CLAIR",
                    languageToggleText: "🌐 ENGLISH", 
                    footerRights: "Tous droits réservés."
                }
            };

            // --- ELEMENTS ---
            const themeToggleButton = document.getElementById('themeToggle');
            const languageToggleButton = document.getElementById('languageToggle');
            const galleryContainer = document.getElementById('imageGallery');
            const imageViewerOverlay = document.getElementById('imageViewerOverlay');
            const fullscreenImage = document.getElementById('fullscreenImage');
            const viewerCloseButton = document.getElementById('viewerCloseButton');
            const viewerPrevButton = document.getElementById('viewerPrevButton');
            const viewerNextButton = document.getElementById('viewerNextButton');
            const imageViewerSpinner = document.getElementById('imageViewerSpinner');
            const currentYearSpan = document.getElementById('currentYear');

            let currentImageIndex = 0;
            let currentLanguage = localStorage.getItem('language') || 'en'; 
            let currentTheme = localStorage.getItem('theme') || 'light'; 

            // --- GALLERY & IMAGE FUNCTIONS ---
            const createImageOnIntersection = (entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const galleryItemDiv = entry.target;
                        const fullResFilename = galleryItemDiv.dataset.fullresFilename; 

                        if (!fullResFilename || galleryItemDiv.querySelector('img')) {
                            observer.unobserve(galleryItemDiv);
                            return;
                        }

                        const img = document.createElement('img');
                        img.src = thumbPath + fullResFilename;
                        const altNamePart = fullResFilename.substring(0, fullResFilename.lastIndexOf('.'));
                        img.alt = `Thumbnail of ${altNamePart.replace(/[\W_]+/g," ")} - Marius Jomphe`;
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        img.addEventListener('load', () => img.classList.add('loaded'));
                        if (img.complete) img.classList.add('loaded'); 

                        galleryItemDiv.appendChild(img);
                        observer.unobserve(galleryItemDiv); 
                    }
                });
            };

            const imageObserver = new IntersectionObserver(createImageOnIntersection, {
                rootMargin: '0px 0px 200px 0px', 
                threshold: 0.01 
            });

            /**
             * [OPTIMIZED] Populates the gallery using a DocumentFragment to minimize DOM reflows.
             */
            function populateGallery() {
                if (!galleryContainer) return;

                // Use a DocumentFragment to batch DOM appends for better performance.
                const fragment = document.createDocumentFragment();

                imageFilenames.forEach((fullResFilename, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.dataset.index = index; 
                    item.dataset.fullresFilename = fullResFilename; 
                    // Append to the fragment instead of the live DOM
                    fragment.appendChild(item);
                    imageObserver.observe(item); 
                });
                
                // Clear the container once, then append the entire fragment in a single operation.
                galleryContainer.innerHTML = ''; 
                galleryContainer.appendChild(fragment);
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (themeToggleButton) { 
                    const toggleDarkText = themeToggleButton.querySelector('[data-lang-key="themeToggleDark"]');
                    const toggleLightText = themeToggleButton.querySelector('[data-lang-key="themeToggleLight"]');
                    if (toggleDarkText && toggleLightText) { 
                        if (theme === 'dark') {
                            toggleDarkText.style.display = 'none';
                            toggleLightText.style.display = 'inline';
                        } else {
                            toggleDarkText.style.display = 'inline';
                            toggleLightText.style.display = 'none';
                        }
                    }
                }
            }

            function applyLanguage(lang) {
                currentLanguage = lang;
                localStorage.setItem('language', lang);
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-lang-key]').forEach(el => {
                    const key = el.dataset.langKey;
                    if (translations[lang] && translations[lang][key]) {
                        if (el.id === 'themeToggle') {
                            const darkTextSpan = el.querySelector('[data-lang-key="themeToggleDark"]');
                            const lightTextSpan = el.querySelector('[data-lang-key="themeToggleLight"]');
                            if (darkTextSpan) darkTextSpan.textContent = translations[lang]['themeToggleDark'];
                            if (lightTextSpan) lightTextSpan.textContent = translations[lang]['themeToggleLight'];
                        } else {
                                el.textContent = translations[lang][key];
                        }
                    }
                });
                if (languageToggleButton) { 
                    languageToggleButton.textContent = translations[lang]?.languageToggleText || (lang === 'en' ? '🌐 FRANÇAIS' : '🌐 ENGLISH');
                }
                applyTheme(currentTheme); 
            }

            if (currentYearSpan) {
                currentYearSpan.textContent = new Date().getFullYear();
            }

            // --- EVENT LISTENERS ---
            if (themeToggleButton) {
                themeToggleButton.addEventListener('click', () => {
                    currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyLanguage(currentLanguage); 
                });
            }

            if (languageToggleButton) {
                languageToggleButton.addEventListener('click', () => {
                    const newLang = currentLanguage === 'en' ? 'fr' : 'en';
                    applyLanguage(newLang);
                });
            }

            // Dropdown Menu Logic
            const dropdownToggles = document.querySelectorAll('.main-nav .dropdown > a');
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function(event) {
                    event.preventDefault();
                    const dropdownMenu = this.nextElementSibling;
                    const isExpanded = this.getAttribute('aria-expanded') === 'true';

                    document.querySelectorAll('.main-nav .dropdown-menu.show').forEach(openMenu => {
                        if (openMenu !== dropdownMenu) {
                            openMenu.classList.remove('show');
                            const otherToggle = openMenu.previousElementSibling;
                            if (otherToggle) {
                                otherToggle.setAttribute('aria-expanded', 'false');
                            }
                        }
                    });

                    dropdownMenu.classList.toggle('show');
                    this.setAttribute('aria-expanded', String(!isExpanded));
                });
            });

            document.addEventListener('click', function(event) {
                const openDropdowns = document.querySelectorAll('.main-nav .dropdown');
                openDropdowns.forEach(dropdown => {
                    const toggle = dropdown.querySelector('a[aria-expanded="true"]');
                    const menu = dropdown.querySelector('.dropdown-menu.show');
                    if (menu && toggle && !dropdown.contains(event.target)) {
                        menu.classList.remove('show');
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                });
            });

            if (galleryContainer) {
                galleryContainer.addEventListener('click', (e) => {
                    const item = e.target.closest('.gallery-item');
                    if (item) {
                        currentImageIndex = parseInt(item.dataset.index);
                        openImageViewer(currentImageIndex);
                    }
                });
            }

            if (viewerCloseButton) viewerCloseButton.addEventListener('click', closeImageViewer);
            if (viewerPrevButton) viewerPrevButton.addEventListener('click', showPrevImage);
            if (viewerNextButton) viewerNextButton.addEventListener('click', showNextImage);
            
            if (imageViewerOverlay) {
                imageViewerOverlay.addEventListener('click', (e) => {
                    if (e.target === imageViewerOverlay) closeImageViewer();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (imageViewerOverlay && imageViewerOverlay.classList.contains('active')) {
                    if (e.key === 'Escape') closeImageViewer();
                    if (e.key === 'ArrowLeft') showPrevImage();
                    if (e.key === 'ArrowRight') showNextImage();
                }
            });
            
            // --- TOUCH GESTURE SUPPORT FOR IMAGE VIEWER ---
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;
            const swipeThreshold = 50; // Minimum pixels to be considered a swipe

            if (imageViewerOverlay) {
                imageViewerOverlay.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1 && imageViewerOverlay.classList.contains('active')) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true }); 

                imageViewerOverlay.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && imageViewerOverlay.classList.contains('active')) {
                        touchEndX = e.touches[0].clientX;
                        touchEndY = e.touches[0].clientY;
                    }
                }, { passive: true }); 

                imageViewerOverlay.addEventListener('touchend', (e) => {
                    if (!imageViewerOverlay.classList.contains('active')) return;

                    if (touchStartX === 0 || touchEndX === 0) { 
                        touchStartX = 0;
                        touchStartY = 0;
                        touchEndX = 0;
                        touchEndY = 0;
                        return;
                    }

                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;

                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > swipeThreshold) {
                        if (deltaX < 0) { 
                            showNextImage();
                        } else { 
                            showPrevImage();
                        }
                    }
                    
                    touchStartX = 0;
                    touchStartY = 0;
                    touchEndX = 0;
                    touchEndY = 0;
                });
            }


            // --- IMAGE VIEWER FUNCTIONS ---

            /**
             * [OPTIMIZED] Preloads the next and previous images to make navigation feel instant.
             * This function creates new Image objects and sets their src, which prompts the
             * browser to download and cache them without displaying them.
             * @param {number} currentIndex The index of the currently displayed image.
             */
            function preloadAdjacentImages(currentIndex) {
                if (imageFilenames.length <= 1) return;

                const nextIndex = (currentIndex + 1) % imageFilenames.length;
                const prevIndex = (currentIndex - 1 + imageFilenames.length) % imageFilenames.length;

                // Preload the next image
                const nextImg = new Image();
                nextImg.src = fullsizePath + imageFilenames[nextIndex];

                // Preload the previous image
                const prevImg = new Image();
                prevImg.src = fullsizePath + imageFilenames[prevIndex];
            }


            function loadAndShowImageInViewer(newIndex, isOpeningCallParam = false) {
                if (!imageViewerOverlay || !fullscreenImage || imageFilenames.length === 0) return;

                const proceedToLoadImage = (targetIndex) => {
                    if (imageViewerSpinner) imageViewerSpinner.style.display = 'block'; 

                    fullscreenImage.style.transition = 'none';
                    fullscreenImage.style.opacity = 0;
                    fullscreenImage.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                    fullscreenImage.alt = "";

                    const imageUrl = fullsizePath + imageFilenames[targetIndex];
                    const altText = `Enlarged view of ${imageFilenames[targetIndex].replace(/[\W_]+/g, " ")} - Marius Jomphe`;

                    const tempImg = new Image();
                    tempImg.onload = () => {
                        fullscreenImage.src = imageUrl; 
                        fullscreenImage.alt = altText;

                        requestAnimationFrame(() => {
                            fullscreenImage.style.transition = 'opacity 0.5s ease-in-out'; 
                            fullscreenImage.style.opacity = 1; 
                        });

                        if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                        updateNavButtons();
                        
                        // [OPTIMIZED] Once the current image is loaded, start preloading the adjacent ones.
                        preloadAdjacentImages(targetIndex);
                    };

                    tempImg.onerror = () => {
                        console.error("Error loading image:", imageUrl);
                        fullscreenImage.alt = "Error loading image";
                        if (imageViewerSpinner) imageViewerSpinner.style.display = 'none';
                        updateNavButtons();
                        if (isOpeningCallParam && currentImageIndex === targetIndex) {
                            setTimeout(closeImageViewer, 1500);
                        }
                    };
                    tempImg.src = imageUrl; 
                };

                if (isOpeningCallParam) {
                    currentImageIndex = newIndex; 
                    imageViewerOverlay.classList.add('active');
                    if (document.body) document.body.style.overflow = 'hidden';
                    proceedToLoadImage(currentImageIndex); 
                } else {
                    fullscreenImage.style.transition = 'opacity 0.5s ease-in-out'; 
                    fullscreenImage.style.opacity = 0;

                    setTimeout(() => {
                        if (!imageViewerOverlay.classList.contains('active')) {
                            if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                            return;
                        }
                        currentImageIndex = newIndex;
                        proceedToLoadImage(currentImageIndex); 
                    }, 500); 
                }
            }

            function openImageViewer(index) {
                loadAndShowImageInViewer(index, true); 
            }

            function closeImageViewer() {
                if (!imageViewerOverlay) return;
                imageViewerOverlay.classList.remove('active');
                if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                
                if (document.body) {
                    document.body.style.overflow = ''; 
                }
            }

            function showPrevImage() {
                if (imageFilenames.length === 0) return;
                const newIndex = (currentImageIndex - 1 + imageFilenames.length) % imageFilenames.length;
                loadAndShowImageInViewer(newIndex); 
            }

            function showNextImage() {
                if (imageFilenames.length === 0) return;
                const newIndex = (currentImageIndex + 1) % imageFilenames.length;
                loadAndShowImageInViewer(newIndex); 
            }

            function updateNavButtons() {
                if (!viewerPrevButton || !viewerNextButton || imageFilenames.length <= 1) {
                    if(viewerPrevButton) viewerPrevButton.style.display = 'none';
                    if(viewerNextButton) viewerNextButton.style.display = 'none';
                    return;
                }
                if(viewerPrevButton) viewerPrevButton.style.display = 'block';
                if(viewerNextButton) viewerNextButton.style.display = 'block';
            }

            // --- INITIAL LOAD ---
            populateGallery();
            applyLanguage(currentLanguage); 
            updateNavButtons(); 

        });
    </script>
