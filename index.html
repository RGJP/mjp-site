    <script>
        // IMMEDIATE THEME & LANGUAGE APPLICATION
        // This script runs synchronously and applies the theme and language
        // before the browser paints the body, preventing FOUC (Flash Of Unstyled Content).
        (function() {
            const isFirstVisit = !localStorage.getItem('hasVisited');

            if (isFirstVisit) {
                localStorage.setItem('language', 'en'); // Default to English on first visit
                localStorage.setItem('theme', 'light'); // Default to light theme on first visit
                localStorage.setItem('hasVisited', 'true');
            }

            const storedTheme = localStorage.getItem('theme') || 'light';
            const storedLanguage = localStorage.getItem('language') || 'en';

            document.documentElement.setAttribute('data-theme', storedTheme);
            document.documentElement.lang = storedLanguage;
        })();
    </script>

    <style>
        :root {
            /* Light Theme (Default) */
            --bg-color: #f4f7f6;
            --text-color: #1a1a1a;
            --header-bg-color: #ffffff;
            --nav-link-color: #333333;
            --nav-link-hover-color: #000000;
            --placeholder-bg-color: #ffffff;
            --button-bg-color: #e0e0e0;
            --button-text-color: #1a1a1a;
            --button-hover-bg-color: #c7c7c7;
            --base-font-size: 16px;
            --base-spacing: 1rem;
            --video-border-color: #000000; /* Black for light theme video border */
            --video-spinner-track-color: rgba(0, 0, 0, 0.1); /* Darker track for light theme spinner */
            /* Added shadow color variable */
            --video-shadow-color: rgba(0, 0, 0, 0.15); /* Light theme shadow */
            /* Added from contact.html for image viewer */
            --image-viewer-bg: rgba(0, 0, 0, 0.95);
            --image-viewer-nav-color: #ffffff;
            --image-viewer-nav-hover-bg: rgba(255, 255, 255, 0.2);
            --loader-color: #333; /* For spinner */
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --header-bg-color: #2c2c2c;
            --nav-link-color: #e0e0e0;
            --nav-link-hover-color: #ffffff;
            --placeholder-bg-color: #000000;
            --button-bg-color: #444444;
            --button-text-color: #f4f7f6;
            --button-hover-bg-color: #5a5a5a;
            --video-border-color: #ffffff; /* White for dark theme video border */
            --video-spinner-track-color: rgba(255, 255, 255, 0.3); /* Lighter track for dark theme spinner */
            /* Updated shadow color for dark theme */
            --video-shadow-color: rgba(0, 0, 0, 0.4); /* Dark theme shadow (slightly darker to stand out on dark bg) */
            /* Added from contact.html for image viewer */
            --image-viewer-bg: rgba(0, 0, 0, 0.95);
            --image-viewer-nav-color: #e0e0e0;
            --loader-color: #f4f7f6; /* For spinner */
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: var(--base-font-size);
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            margin-bottom: calc(var(--base-spacing) * 0.75);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--nav-link-hover-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1800px;
            margin: 0 auto;
            padding: var(--base-spacing);
        }

        .site-header {
            background-color: var(--header-bg-color);
            padding: var(--base-spacing) 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 100;
            color: var(--text-color);
            white-space: nowrap;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            gap: calc(var(--base-spacing) * 1.5);
        }

        .main-nav a {
            font-weight: 500;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--nav-link-color);
            padding: calc(var(--base-spacing) * 0.5) 0;
            position: relative;
            text-transform: uppercase;
            /* FIX: The problematic 'display: inline-block;' was removed from here */
        }
        .main-nav a.active {
            color: var(--text-color);
            font-weight: 700;
        }

        .main-nav a.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            display: block;
            bottom: 0px; 
            left: 0;
            background: var(--text-color);
        }

        .main-nav a::after { 
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            display: block;
            margin-top: 5px; 
            right: 0;
            background: var(--nav-link-hover-color);
            transition: width 0.3s ease;
        }
        
        .main-nav a:hover::after {
            width: 100%;
            left: 0;
            background: var(--nav-link-hover-color);
        }
        /* Prevent sticky hover underline on dropdown toggles on touch devices */
        @media (hover: none) and (pointer: coarse) {
            .main-nav .dropdown > a:hover::after {
                display: none;
            }
        }


        .main-nav a:hover,
        .main-nav .dropdown > a:hover {
            color: var(--nav-link-hover-color);
            text-decoration: none;
        }

        /* Dropdown Menu Styles */
        .main-nav .dropdown {
            position: relative;
        }

        .main-nav .dropdown > a {
            cursor: pointer;
        }
        
        .main-nav .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            background-color: var(--header-bg-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            list-style: none;
            padding: calc(var(--base-spacing) * 0.5) 0;
            margin: 0;
            min-width: 200px;
            z-index: 1100;
            border-radius: 4px;
            border: 1px solid var(--button-bg-color);
        }

        .main-nav .dropdown-menu.show {
            display: block;
        }

        .main-nav .dropdown-menu li a {
            display: block;
            padding: calc(var(--base-spacing) * 0.6) calc(var(--base-spacing) * 1.2);
            color: var(--nav-link-color);
            text-transform: none;
            font-size: clamp(0.85rem, 1.3vw, 1rem);
            font-weight: 400;
            white-space: nowrap;
        }

        .main-nav .dropdown-menu li a:hover {
            background-color: var(--button-bg-color);
            color: var(--nav-link-hover-color);
            text-decoration: none;
        }

        .main-nav .dropdown-menu li a::after,
        .main-nav .dropdown-menu li a:hover::after {
            display: none; 
        }
        /* End Dropdown Menu Styles */


        .controls {
            display: flex;
            align-items: center;
            gap: calc(var(--base-spacing) * 1.5);
        }

        .control-button {
            background: none;
            border: none;
            font-weight: 500;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--nav-link-color);
            padding: calc(var(--base-spacing) * 0.5) 0;
            position: relative;
            cursor: pointer;
            transition: color 0.2s ease;
            text-transform: uppercase;
            line-height: inherit;
            display: inline-block;
            min-width: auto;
        }

        .control-button::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            display: block;
            margin-top: 5px;
            right: 0;
            background: var(--nav-link-hover-color);
            transition: width 0.3s ease;
        }

        .control-button:hover {
            color: var(--nav-link-hover-color);
        }

        .control-button:hover::after {
            width: 100%;
            left: 0;
            background: var(--nav-link-hover-color);
        }

        .control-button:active::after,
        .control-button:focus::after {
            width: 0; 
        }

        [data-theme="dark"] .control-button {
            color: var(--nav-link-color);
        }

        /* Image Gallery */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--base-spacing);
            padding: calc(var(--base-spacing) * 2) 0;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background-color: var(--placeholder-bg-color);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            content-visibility: auto;
            contain-intrinsic-size: 250px 250px;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .gallery-item img.loaded {
            opacity: 1;
        }

        /* Fullscreen Image Viewer */
        .image-viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--image-viewer-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        
        /* When in fullscreen, ensure the background is set directly on the element */
        .image-viewer-overlay:fullscreen {
             background-color: var(--image-viewer-bg);
        }
        html[data-theme='dark'] .image-viewer-overlay:fullscreen {
             background-color: var(--image-viewer-bg);
        }


        .image-viewer-overlay.active {
            opacity: 1;
            visibility: visible;
            transition-delay: 0s;
        }

        .image-viewer-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--image-viewer-nav-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 2002;
            display: none;
            opacity: 0.3;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .image-viewer-content {
            width: 100vw;
            height: 100vh;
            padding: 5vh 5vw; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-viewer-content img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 3px;
            opacity: 0;
        }

        .viewer-close-button,
        .viewer-nav-button {
            position: fixed;
            background: transparent;
            color: var(--image-viewer-nav-color);
            border: none;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            cursor: pointer;
            padding: calc(var(--base-spacing) * 0.5);
            transition: background-color 0.2s ease, color 0.2s ease;
            z-index: 2001; 
            border-radius: 50%;
            width: clamp(40px, 6vw, 60px);
            height: clamp(40px, 6vw, 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .viewer-close-button:hover,
        .viewer-nav-button:hover {
            background-color: var(--image-viewer-nav-hover-bg);
        }

        .viewer-close-button {
            top: calc(var(--base-spacing) * 1.5);
            right: calc(var(--base-spacing) * 1.5);
        }

        .viewer-nav-button.prev {
            left: calc(var(--base-spacing) * 1.5);
            top: 50%;
            transform: translateY(-50%);
        }

        .viewer-nav-button.next {
            right: calc(var(--base-spacing) * 1.5);
            top: 50%;
            transform: translateY(-50%);
        }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: calc(var(--base-spacing) * 1) 0;
            margin-top: calc(var(--base-spacing) * 2);
            border-top: 1px solid var(--button-bg-color);
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
        }

        .site-footer .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--base-spacing) * 0.5);
        }

        .artist-signature {
            margin-top: calc(var(--base-spacing) * 0.5);
            margin-bottom: calc(var(--base-spacing) * 0.5);
        }

        .artist-signature img {
            max-width: 300px;
            height: auto;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            display: none;
        }

        html[data-theme="light"] .artist-signature .signature-light {
            display: block;
        }

        html[data-theme="dark"] .artist-signature .signature-dark {
            display: block;
        }

        .artist-signature a {
            text-decoration: none; 
            display: inline-block; 
        }

        .artist-signature a:hover {
            text-decoration: none; 
        }

        /* Responsive Adjustments */
        @media (max-width: 767px) { 
            .main-nav ul {
                flex-wrap: wrap; 
                justify-content: center; 
            }
            .main-nav .dropdown-menu { 
                left: 50%;
                transform: translateX(-50%);
                min-width: 180px; 
            }
        }

        @media (max-width: 480px) {
            .site-header .container {
                flex-direction: column;
                gap: calc(var(--base-spacing) * 0.5);
            }
            .main-nav ul {
                gap: var(--base-spacing);
                justify-content: center;
                flex-wrap: wrap;
            }
            .controls {
                margin-top: calc(var(--base-spacing) * 0.5);
            }
        }

        @media (min-width: 1200px) {
            :root {
                --base-font-size: 17px;
            }
        }

        @media (min-width: 2000px) {
            :root {
                --base-font-size: 20px;
            }
            .container {
                max-width: 2400px;
            }
            .logo {
                font-size: 2.8rem;
            }
            .main-nav a, .main-nav .dropdown > a {
                font-size: 1.4rem;
            }
            .main-nav .dropdown-menu li a {
                font-size: 1.3rem;
            }
            .control-button {
                padding: calc(var(--base-spacing) * 0.7) calc(var(--base-spacing) * 1.2);
                font-size: 1.2rem;
            }
        }

        /* Promo Overlay styles from the original index.html */
        .promo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg-color, rgba(0, 0, 0, 0.8));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }

        .promo-overlay.active {
            opacity: 1;
            visibility: visible;
            transition-delay: 0s;
        }

        .promo-content {
            background-color: var(--overlay-content-bg, #fff);
            color: var(--overlay-text-color, #1a1a1a);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            max-width: 90%;
            width: 500px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease-out;
        }
        
        /* ... remaining promo styles from original index.html ... */
        .promo-overlay.active .promo-content {
            transform: translateY(0);
        }

        .promo-content h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        .promo-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .promo-content a {
            color: var(--overlay-link-color, #007bff);
            font-weight: bold;
            text-decoration: none;
        }

        .promo-content a:hover {
            text-decoration: underline;
        }

        .promo-content video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            background-color: #000;
            margin-bottom: 1.5rem;
            display: block; /* Ensures it takes up full width */
        }

        .video-play-button {
            background-color: var(--overlay-button-bg, #007bff);
            color: var(--overlay-button-text, #fff);
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .video-play-button:hover {
            background-color: var(--overlay-button-hover-bg, #0056b3); 
        }

        .overlay-close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--overlay-text-color, #1a1a1a);
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .overlay-close-button:hover {
            color: #ff0000;
        }

        .fullscreen-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .fullscreen-video-overlay video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .fullscreen-video-overlay .close-video-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 4001;
        }
    </style>
</head>

    <script>
        // --- START OF UNIFIED ACTIVE LINK SCRIPT (Place before DOMContentLoaded) ---

        // Part 1: Handle top-level navigation links
        document.querySelectorAll('.main-nav > ul > li > a').forEach(link => {
            const currentPath = window.location.pathname;
            const linkHref = link.getAttribute('href'); // Standardized variable name

            link.classList.remove('active'); // Crucial: Reset active class for ALL top-level links first

            if (linkHref && linkHref !== '#') { // Process only actual navigation links
                let isActive = false;
                // Check if currentPath ends with linkHref (e.g. /about.html ends with about.html)
                if (currentPath.endsWith(linkHref)) {
                    isActive = true;
                }
                // Special case for the homepage (index.html)
                // It can be accessed as '/', or ends with '/index.html'.
                if ((currentPath === '/' || currentPath.endsWith('/index.html')) && linkHref === 'index.html') {
                    isActive = true;
                }

                if (isActive) {
                    link.classList.add('active');
                }
            }
        });

        // Part 2: Handle dropdown sub-links and activate their parent
        document.querySelectorAll('.main-nav .dropdown-menu a').forEach(subLink => {
            const currentPath = window.location.pathname;
            const subLinkHrefAttribute = subLink.getAttribute('href');

            if (subLinkHrefAttribute) {
                const subLinkBaseName = subLinkHrefAttribute.replace(/\.html$/, '');

                let normalizedCurrentPath = currentPath;
                // Normalize currentPath: remove trailing slash if not root
                if (normalizedCurrentPath.endsWith('/') && normalizedCurrentPath.length > 1) {
                    normalizedCurrentPath = normalizedCurrentPath.slice(0, -1);
                }
                const currentPathLastSegment = normalizedCurrentPath.substring(normalizedCurrentPath.lastIndexOf('/') + 1);

                if (currentPathLastSegment === subLinkBaseName || currentPathLastSegment === subLinkHrefAttribute) {
                    subLink.classList.add('active');

                    const parentDropdownToggle = subLink.closest('.dropdown')?.querySelector(':scope > a');
                    if (parentDropdownToggle) {
                        parentDropdownToggle.classList.add('active');
                    }
                } else {
                    subLink.classList.remove('active'); // Ensure sublink is not active if not current
                }
            }
        });
        // --- END OF UNIFIED ACTIVE LINK SCRIPT ---

        document.addEventListener('DOMContentLoaded', () => {
            
            // --- CONFIGURATION ---
            const imageFilenames = [
                'Galerie-1.jpg',   'Galerie-2.jpg',   'Galerie-3.jpg',   'Galerie-4.jpg',   'Galerie-5.jpg',

                'Galerie-66.jpg',  'Galerie-67.jpg',  'Galerie-68.jpg',  'Galerie-69.jpg',  'Galerie-70.jpg',

                'Galerie-126.jpg', 'Galerie-127.jpg', 'Galerie-128.jpg', 'Galerie-129.jpg', 'Galerie-130.jpg',

            const thumbPath = 'images/thumbs/';
            const fullsizePath = 'images/fullsize/';

            // --- TRANSLATIONS ---
            const translations = {
                en: {
                    siteTitle: "Marius Jomphe ‧ Photography",
                    pageTitleGallery: "Gallery • Marius Jomphe Photography",
                    navImages: "GALLERY",
                    navProjects: "PROJECTS", 
                    projectSonde: "SONDE",
                    projectBruine: "BRUINE",

                    navAbout: "ABOUT",

                fr: {

                    pageTitleGallery: "Galerie • Marius Jomphe Photographie",
                    navImages: "GALERIE",
                    navProjects: "PROJETS", 
                    projectSonde: "SONDE",
                    projectBruine: "BRUINE",

                    navAbout: "À PROPOS",
                    navContact: "CONTACT",
                    themeToggleDark: "THÈME SOMBRE",
                    themeToggleLight: "THÈME CLAIR",

                    footerRights: "Tous droits réservés."
                }
            };

            // --- ELEMENTS ---
            const themeToggleButton = document.getElementById('themeToggle');
            const languageToggleButton = document.getElementById('languageToggle');
            const galleryContainer = document.getElementById('imageGallery');
            const imageViewerOverlay = document.getElementById('imageViewerOverlay');
            const fullscreenImage = document.getElementById('fullscreenImage');
            const viewerCloseButton = document.getElementById('viewerCloseButton');
            const viewerPrevButton = document.getElementById('viewerPrevButton');
            const viewerNextButton = document.getElementById('viewerNextButton');
            const imageViewerSpinner = document.getElementById('imageViewerSpinner');
            const currentYearSpan = document.getElementById('currentYear');

            // Promo Overlay Elements
            const promoOverlay = document.getElementById('promoOverlay');
            const promoCloseButton = document.getElementById('promoCloseButton');
            const promoVideo = document.getElementById('promoVideo');
            const videoPlayButton = document.getElementById('videoPlayButton');
            const fullscreenVideoOverlay = document.getElementById('fullscreenVideoOverlay');
            const fullscreenVideo = document.getElementById('fullscreenVideo');
            const closeVideoButton = document.getElementById('closeVideoButton');


            let currentImageIndex = 0;
            let currentLanguage = localStorage.getItem('language') || 'en'; 
            let currentTheme = localStorage.getItem('theme') || 'light'; 

            // --- HELPER FUNCTIONS FOR FULLSCREEN ---
            function openFullscreen(element) {
                if (element.requestFullscreen) {
                    element.requestFullscreen().catch(err => console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`));
                } else if (element.mozRequestFullScreen) { /* Firefox */
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) { /* IE/Edge */
                    element.msRequestFullscreen();
                }
            }

            function exitFullscreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) { /* Firefox */
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) { /* Chrome, Safari and Opera */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE/Edge */
                    document.msExitFullscreen();
                }
            }

            function handleFullscreenChange() {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (!isFullscreen && imageViewerOverlay && imageViewerOverlay.classList.contains('active')) {
                    closeImageViewer(); // We've exited fullscreen via browser UI, so ensure the viewer is also closed.
                }
            }


            // --- GALLERY & IMAGE FUNCTIONS ---
            const createImageOnIntersection = (entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const galleryItemDiv = entry.target;
                        const fullResFilename = galleryItemDiv.dataset.fullresFilename; 

                        if (!fullResFilename || galleryItemDiv.querySelector('img')) {
                            observer.unobserve(galleryItemDiv);
                            return;
                        }

                        const img = document.createElement('img');
                        img.src = thumbPath + fullResFilename;
                        const altNamePart = fullResFilename.substring(0, fullResFilename.lastIndexOf('.'));
                        img.alt = `Thumbnail of ${altNamePart.replace(/[\W_]+/g," ")} - Marius Jomphe`;
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        img.addEventListener('load', () => img.classList.add('loaded'));
                        if (img.complete) img.classList.add('loaded'); 

                        galleryItemDiv.appendChild(img);
                        observer.unobserve(galleryItemDiv); 
                    }
                });
            };

            const imageObserver = new IntersectionObserver(createImageOnIntersection, {
                rootMargin: '0px 0px 200px 0px', 
                threshold: 0.01 
            });

            function populateGallery() {
                if (!galleryContainer) return;
                const fragment = document.createDocumentFragment();
                imageFilenames.forEach((fullResFilename, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.dataset.index = index; 
                    item.dataset.fullresFilename = fullResFilename; 
                    fragment.appendChild(item);
                    imageObserver.observe(item); 
                });
                galleryContainer.innerHTML = ''; 
                galleryContainer.appendChild(fragment);
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (themeToggleButton) { 
                    const toggleDarkText = themeToggleButton.querySelector('[data-lang-key="themeToggleDark"]');
                    const toggleLightText = themeToggleButton.querySelector('[data-lang-key="themeToggleLight"]');
                    if (toggleDarkText && toggleLightText) { 
                        if (theme === 'dark') {
                            toggleDarkText.style.display = 'none';
                            toggleLightText.style.display = 'inline';
                        } else {
                            toggleDarkText.style.display = 'inline';
                            toggleLightText.style.display = 'none';
                        }
                    }
                }
            }

            function applyLanguage(lang) {
                currentLanguage = lang;
                localStorage.setItem('language', lang);
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-lang-key]').forEach(el => {
                    const key = el.dataset.langKey;
                    if (translations[lang] && translations[lang][key]) {
                        if (el.tagName === 'TITLE') {
                            document.title = translations[lang][key];
                        } else {
                            el.textContent = translations[lang][key];
                        }
                    }
                });
                if (languageToggleButton) {
                    languageToggleButton.textContent = translations[lang]?.languageToggleText || (lang === 'en' ? '🌐 FRANÇAIS' : '🌐 ENGLISH');
                }
                applyTheme(currentTheme); 
            }

            if (currentYearSpan) {
                currentYearSpan.textContent = new Date().getFullYear();
            }

            function preloadAdjacentImages(currentIndex) {
                if (imageFilenames.length <= 1) return;
                const nextIndex = (currentIndex + 1) % imageFilenames.length;
                const prevIndex = (currentIndex - 1 + imageFilenames.length) % imageFilenames.length;
                const nextImg = new Image();
                nextImg.src = fullsizePath + imageFilenames[nextIndex];
                const prevImg = new Image();
                prevImg.src = fullsizePath + imageFilenames[prevIndex];
            }


            function loadAndShowImageInViewer(newIndex, isOpeningCallParam = false) {
                if (!imageViewerOverlay || !fullscreenImage || imageFilenames.length === 0) return;

                const proceedToLoadImage = (targetIndex) => {
                    if (imageViewerSpinner) imageViewerSpinner.style.display = 'block'; 
                    fullscreenImage.style.transition = 'none';
                    fullscreenImage.style.opacity = 0;
                    fullscreenImage.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                    fullscreenImage.alt = "";

                    const imageUrl = fullsizePath + imageFilenames[targetIndex];
                    const altText = `Enlarged view of ${imageFilenames[targetIndex].replace(/[\W_]+/g, " ")} - Marius Jomphe`;

                    const tempImg = new Image();
                    tempImg.onload = () => {
                        fullscreenImage.src = imageUrl; 
                        fullscreenImage.alt = altText;
                        requestAnimationFrame(() => {
                            fullscreenImage.style.transition = 'opacity 0.5s ease-in-out'; 
                            fullscreenImage.style.opacity = 1; 
                        });
                        if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                        updateNavButtons();
                        preloadAdjacentImages(targetIndex);
                    };
                    tempImg.onerror = () => {
                        console.error("Error loading image:", imageUrl);
                        fullscreenImage.alt = "Error loading image";
                        if (imageViewerSpinner) imageViewerSpinner.style.display = 'none';
                        updateNavButtons();
                        if (isOpeningCallParam && currentImageIndex === targetIndex) {
                            setTimeout(closeImageViewer, 1500);
                        }
                    };
                    tempImg.src = imageUrl; 
                };

                if (isOpeningCallParam) {
                    currentImageIndex = newIndex; 
                    imageViewerOverlay.classList.add('active');
                    if (document.body) document.body.style.overflow = 'hidden';
                    proceedToLoadImage(currentImageIndex); 
                } else {
                    fullscreenImage.style.transition = 'opacity 0.5s ease-in-out'; 
                    fullscreenImage.style.opacity = 0;
                    setTimeout(() => {
                        if (!imageViewerOverlay.classList.contains('active')) {
                            if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                            return;
                        }
                        currentImageIndex = newIndex;
                        proceedToLoadImage(currentImageIndex); 
                    }, 500); 
                }
            }
            
            function openImageViewer(index) {
                if(imageViewerOverlay) {
                    openFullscreen(imageViewerOverlay);
                }
                loadAndShowImageInViewer(index, true); 
            }

            function closeImageViewer() {
                if (!imageViewerOverlay) return;

                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isFullscreen) {
                    exitFullscreen();
                }
                
                imageViewerOverlay.classList.remove('active');
                if (imageViewerSpinner) imageViewerSpinner.style.display = 'none'; 
                if (document.body) {
                    document.body.style.overflow = ''; 
                }
            }

            function showPrevImage() {
                if (imageFilenames.length === 0) return;
                const newIndex = (currentImageIndex - 1 + imageFilenames.length) % imageFilenames.length;
                loadAndShowImageInViewer(newIndex); 
            }

            function showNextImage() {
                if (imageFilenames.length === 0) return;
                const newIndex = (currentImageIndex + 1) % imageFilenames.length;
                loadAndShowImageInViewer(newIndex); 
            }

            function updateNavButtons() {
                if (!viewerPrevButton || !viewerNextButton || imageFilenames.length <= 1) {
                    if(viewerPrevButton) viewerPrevButton.style.display = 'none';
                    if(viewerNextButton) viewerNextButton.style.display = 'none';
                    return;
                }
                if(viewerPrevButton) viewerPrevButton.style.display = 'block';
                if(viewerNextButton) viewerNextButton.style.display = 'block';
            }
            
            // --- EVENT LISTENERS ---
            if (themeToggleButton) {
                themeToggleButton.addEventListener('click', () => {
                    currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(currentTheme);
                    applyLanguage(currentLanguage);
                });
            }

            if (languageToggleButton) {
                languageToggleButton.addEventListener('click', () => {
                    const newLang = currentLanguage === 'en' ? 'fr' : 'en';
                    applyLanguage(newLang);
                });
            }

            const dropdownToggles = document.querySelectorAll('.main-nav .dropdown > a');
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function(event) {
                    event.preventDefault();
                    const dropdownMenu = this.nextElementSibling;
                    const isExpanded = this.getAttribute('aria-expanded') === 'true';

                    document.querySelectorAll('.main-nav .dropdown-menu.show').forEach(openMenu => {
                        if (openMenu !== dropdownMenu) {
                            openMenu.classList.remove('show');
                            const otherToggle = openMenu.previousElementSibling;
                            if (otherToggle) {
                                otherToggle.setAttribute('aria-expanded', 'false');
                            }
                        }
                    });

                    dropdownMenu.classList.toggle('show');
                    this.setAttribute('aria-expanded', String(!isExpanded));
                    
                    const currentPath = window.location.pathname;
                    let isSubPageOfThisToggleActive = false;
                    const subMenuLinks = this.nextElementSibling.querySelectorAll('a');

                    subMenuLinks.forEach(subLink => {
                        const subLinkHrefAttribute = subLink.getAttribute('href');
                        if (subLinkHrefAttribute && subLinkHrefAttribute !== '#') {
                            const subLinkBaseName = subLinkHrefAttribute.replace(/\.html$/, '');
                            let normalizedCurrentPath = currentPath;
                            if (normalizedCurrentPath.endsWith('/') && normalizedCurrentPath.length > 1) {
                                normalizedCurrentPath = normalizedCurrentPath.slice(0, -1);
                            }
                            const currentPathLastSegment = normalizedCurrentPath.substring(normalizedCurrentPath.lastIndexOf('/') + 1);

                            if (currentPathLastSegment === subLinkBaseName || currentPathLastSegment === subLinkHrefAttribute) {
                                isSubPageOfThisToggleActive = true;
                            }
                        }
                    });

                    if (isSubPageOfThisToggleActive) {
                        this.classList.add('active');
                    }
                });
            });

            document.addEventListener('click', function(event) {
                const openDropdowns = document.querySelectorAll('.main-nav .dropdown');
                openDropdowns.forEach(dropdown => {
                    const toggle = dropdown.querySelector('a[aria-expanded="true"]');
                    const menu = dropdown.querySelector('.dropdown-menu.show');
                    if (menu && toggle && !dropdown.contains(event.target)) {
                        menu.classList.remove('show');
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                });
            });

            if (galleryContainer) {
                galleryContainer.addEventListener('click', (e) => {
                    const item = e.target.closest('.gallery-item');
                    if (item) {
                        currentImageIndex = parseInt(item.dataset.index);
                        openImageViewer(currentImageIndex);
                    }
                });
            }

            if (viewerCloseButton) viewerCloseButton.addEventListener('click', closeImageViewer);
            if (viewerPrevButton) viewerPrevButton.addEventListener('click', showPrevImage);
            if (viewerNextButton) viewerNextButton.addEventListener('click', showNextImage);
            
            if (imageViewerOverlay) {
                imageViewerOverlay.addEventListener('click', (e) => {
                    if (e.target === imageViewerOverlay) closeImageViewer();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (imageViewerOverlay && imageViewerOverlay.classList.contains('active')) {
                    if (e.key === 'Escape') closeImageViewer();
                    if (e.key === 'ArrowLeft') showPrevImage();
                    if (e.key === 'ArrowRight') showNextImage();
                }
            });
            
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;
            const swipeThreshold = 50; 

            if (imageViewerOverlay) {
                imageViewerOverlay.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1 && imageViewerOverlay.classList.contains('active')) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true }); 

                imageViewerOverlay.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && imageViewerOverlay.classList.contains('active')) {
                        touchEndX = e.touches[0].clientX;
                        touchEndY = e.touches[0].clientY;
                    }
                }, { passive: true }); 

                imageViewerOverlay.addEventListener('touchend', (e) => {
                    if (!imageViewerOverlay.classList.contains('active')) return;

                    if (touchStartX === 0 || touchEndX === 0) { 
                        touchStartX = 0;
                        touchStartY = 0;
                        touchEndX = 0;
                        touchEndY = 0;
                        return;
                    }

                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;

                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > swipeThreshold) {
                        if (deltaX < 0) { 
                            showNextImage();
                        } else { 
                            showPrevImage();
                        }
                    }
                    
                    touchStartX = 0;
                    touchStartY = 0;
                    touchEndX = 0;
                    touchEndY = 0;
                });
            }

            // Fullscreen change listeners
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);

            // --- PROMO OVERLAY FUNCTIONS ---
            function openPromoOverlay() {
                promoOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePromoOverlay() {
                promoOverlay.classList.remove('active');
                document.body.style.overflow = '';
                promoVideo.pause();
                promoVideo.currentTime = 0;
            }

            function openFullscreenVideo() {
                fullscreenVideo.src = promoVideo.querySelector('source').src;
                fullscreenVideoOverlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                fullscreenVideo.load();
                fullscreenVideo.play();
            }

            function closeFullscreenVideo() {
                fullscreenVideo.pause();
                fullscreenVideo.currentTime = 0;
                fullscreenVideoOverlay.style.display = 'none';
                document.body.style.overflow = '';
            }

            if (promoCloseButton) promoCloseButton.addEventListener('click', closePromoOverlay);
            if (videoPlayButton) videoPlayButton.addEventListener('click', openFullscreenVideo);
            if (closeVideoButton) closeVideoButton.addEventListener('click', closeFullscreenVideo);
            if (promoOverlay) promoOverlay.addEventListener('click', (e) => {
                if (e.target === promoOverlay) closePromoOverlay();
            });
            if (fullscreenVideoOverlay) fullscreenVideoOverlay.addEventListener('click', (e) => {
                if (e.target === fullscreenVideoOverlay || e.target === closeVideoButton) closeFullscreenVideo();
            });
            document.addEventListener('keydown', (e) => {
                if (fullscreenVideoOverlay.style.display === 'flex' && e.key === 'Escape') closeFullscreenVideo();
            });

            window.addEventListener('load', () => {
                setTimeout(openPromoOverlay, 500);
            });

            // --- INITIAL LOAD ---
            populateGallery();
            applyLanguage(currentLanguage); 
            updateNavButtons(); 
        });
    </script>
